[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.backends._legacy:Backend"

[project]
name = "app"
version = "0.1.0"
description = "CA Software backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "sqlalchemy",
    "psycopg[binary]",
    "python-jose[cryptography]",
    "passlib[bcrypt]",
    "python-multipart",
    "httpx",
    "mcp>=1.0.0",
    "openai>=1.50.0",
    "anthropic>=0.37.0",
    "groq>=0.11.0",
    "python-dotenv",
    "pydantic-settings",
    "alembic",
    "tzdata",
    "celery",
    "redis",
    "boto3",
    "aiosmtplib",
    "Pillow",
    "reportlab",
]

[tool.setuptools]
packages = ["app"]

[tool.setuptools.package-dir]
app = "app"
